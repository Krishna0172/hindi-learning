<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f6f6a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Alphabet — Bol Hindi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header"></header>

    <main class="page">
      <div class="section-head">
        <div>
          <h1 data-i18n="alphabetTitle">Devanagari alphabet</h1>
          <p data-i18n="alphabetLead">Tap a letter to see pronunciation tips in your language.</p>
        </div>
      </div>

      <div id="alphabet-grid" class="grid alphabet-grid" aria-live="polite"></div>
      <section id="letter-detail" class="panel detail" hidden></section>
    </main>

    <footer class="site-footer">
      <p data-i18n="footer">Learn Hindi for English and Tamil speakers.</p>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/site.js"></script>
    <script src="js/data-alphabet.js"></script>
    <script src="js/alphabet.js"></script>
  </body>
</html>
