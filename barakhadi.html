<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f6f6a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Barakhadi — Bol Hindi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"

    <link rel="stylesheet" href="css/styles.css" />

  <body>
    <header class="site-header"></header>

    <main class="page">
      <div class="section-head">

          <h1 data-i18n="barakhadiTitle">Barakhadi</h1>
          <p data-i18n="barakhadiLead">Full ka-series for every consonant — pick a letter to see all matra forms.</p>

      <h2 id="barakhadi-current" class="barakhadi-heading"></h2>
      <div id="barakhadi-grid" class="grid words-grid"></div>
    </main>

    <footer class="site-footer">
      <p data-i18n="footer">Learn Hindi for English and Tamil speakers.</p>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/site.js"></script>
